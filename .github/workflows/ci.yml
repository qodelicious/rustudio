name: CI

on:
  push:
    branches: [main, macos-port]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
          - name: macOS arm64
            os: macos-15
          - name: macOS x86_64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # mesa-vulkan-drivers: a software Vulkan GPU for the shader tests
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libudev-dev mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

  # rustudio.app for Apple Silicon and Intel (ad-hoc signed, not notarized),
  # attached to the GitHub release when a v* tag is pushed.
  macos-app:
    name: macOS app (universal)
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Bundle
        run: tools/macos/bundle.sh --universal
      - name: Check the bundle
        run: |
          lipo -archs target/macos/rustudio.app/Contents/MacOS/rustudio
          codesign --verify --strict target/macos/rustudio.app
          test -f target/macos/rustudio.app/Contents/Resources/api-dump.json
      - uses: actions/upload-artifact@v4
        with:
          name: rustudio-macos-universal
          path: target/macos/*.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" target/macos/*.zip --clobber || gh release create "$GITHUB_REF_NAME" target/macos/*.zip --prerelease --title "$GITHUB_REF_NAME" --notes "macOS build: unzip, move rustudio.app to Applications, right-click > Open the first time (not notarized)."
